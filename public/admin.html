<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Summit - Admin Panel</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">AI Summit</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="#" id="logout-link">Logout</a></li>
      </ul>
    </div>
  </nav>

  <div class="container" style="padding-top: 40px;">
    <div class="admin-grid">
      <aside class="admin-sidebar">
        <h3>Admin Panel</h3>
        <ul>
          <li><a href="#banner" class="nav-link active" data-section="banner">Banner</a></li>
          <li><a href="#speakers" class="nav-link" data-section="speakers">Speakers</a></li>
          <li><a href="#events" class="nav-link" data-section="events">Events</a></li>
          <li><a href="#sponsors" class="nav-link" data-section="sponsors">Sponsors</a></li>
          <li><a href="#registrations" class="nav-link" data-section="registrations">Registrations</a></li>
        </ul>
      </aside>

      <main class="admin-content">
        <!-- Banner Section -->
        <div id="banner" class="admin-section active">
          <h2>Manage Banner</h2>
          <div id="banner-message"></div>
          <form id="banner-form">
            <div class="form-group">
              <label for="banner_title">Banner Title *</label>
              <input type="text" id="banner_title" name="banner_title" required maxlength="1000">
            </div>
            <div class="form-group">
              <label for="banner_description">Banner Description *</label>
              <textarea id="banner_description" name="banner_description" required maxlength="10000"></textarea>
            </div>
            <div class="form-group">
              <label for="banner_image">Banner Image *</label>
              <input type="file" id="banner_image" name="banner_image" required accept="image/*">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Save Banner</button>
            </div>
          </form>
        </div>

        <!-- Speakers Section -->
        <div id="speakers" class="admin-section">
          <h2>Manage Speakers</h2>
          <div id="speakers-message"></div>
          <form id="speakers-form">
            <div class="form-group">
              <label for="speaker_first_name">First Name *</label>
              <input type="text" id="speaker_first_name" name="first_name" required maxlength="1000">
            </div>
            <div class="form-group">
              <label for="speaker_middle_name">Middle Name</label>
              <input type="text" id="speaker_middle_name" name="middle_name" maxlength="1000">
            </div>
            <div class="form-group">
              <label for="speaker_last_name">Last Name</label>
              <input type="text" id="speaker_last_name" name="last_name" maxlength="1000">
            </div>
            <div class="form-group">
              <label for="speaker_bio">Bio *</label>
              <textarea id="speaker_bio" name="bio" required maxlength="5000"></textarea>
            </div>
            <div class="form-group">
              <label for="speaker_headshot">Headshot Image *</label>
              <input type="file" id="speaker_headshot" name="headshot" required accept="image/*">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Add Speaker</button>
            </div>
          </form>

          <h3 style="margin-top: 40px; color: #00d9ff;">Current Speakers</h3>
          <div id="speakers-list" class="grid" style="margin-top: 20px;">
            <div class="loading"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Events Section -->
        <div id="events" class="admin-section">
          <h2>Manage Events</h2>
          <div id="events-message"></div>
          <form id="events-form">
            <div class="form-group">
              <label for="event_title">Event Title *</label>
              <input type="text" id="event_title" name="event_title" required maxlength="1000">
            </div>
            <div class="form-group">
              <label for="event_description">Event Description *</label>
              <textarea id="event_description" name="event_description" required maxlength="10000"></textarea>
            </div>
            <div class="form-group">
              <label for="event_thumbnail">Thumbnail Image *</label>
              <input type="file" id="event_thumbnail" name="thumbnail" required accept="image/*">
            </div>
            <div class="form-group">
              <label for="event_tags">Tags</label>
              <input type="text" id="event_tags" name="tags" maxlength="1000">
              <p class="form-hint">Comma-separated list</p>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Add Event</button>
            </div>
          </form>

          <h3 style="margin-top: 40px; color: #00d9ff;">Current Events</h3>
          <div id="events-list" class="grid" style="margin-top: 20px;">
            <div class="loading"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Sponsors Section -->
        <div id="sponsors" class="admin-section">
          <h2>Manage Sponsors</h2>
          <div id="sponsors-message"></div>
          <form id="sponsors-form">
            <div class="form-group">
              <label for="sponsor_name">Sponsor Name *</label>
              <input type="text" id="sponsor_name" name="sponsor_name" required maxlength="1000">
            </div>
            <div class="form-group">
              <label for="sponsor_tier">Sponsor Tier *</label>
              <select id="sponsor_tier" name="sponsor_tier" required>
                <option value="">Select tier...</option>
                <option value="platinum">Platinum</option>
                <option value="gold">Gold</option>
                <option value="silver">Silver</option>
                <option value="bronze">Bronze</option>
              </select>
            </div>
            <div class="form-group">
              <label for="sponsor_logo">Sponsor Logo *</label>
              <input type="file" id="sponsor_logo" name="logo" required accept="image/*">
            </div>
            <div class="form-actions">
              <button type="submit" class="btn btn-primary">Add Sponsor</button>
            </div>
          </form>

          <h3 style="margin-top: 40px; color: #00d9ff;">Current Sponsors</h3>
          <div id="sponsors-list" class="grid" style="margin-top: 20px;">
            <div class="loading"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Registrations Section -->
        <div id="registrations" class="admin-section">
          <h2>Registrations</h2>

          <!-- Search, Filter, and Sort Controls -->
          <div class="registrations-controls">
            <div class="search-box">
              <input type="text" id="reg-search" placeholder="Search by name or email...">
            </div>

            <div class="filters-row">
              <div class="filter-group">
                <label for="filter-status">Status</label>
                <select id="filter-status" multiple>
                  <option value="pending">Pending</option>
                  <option value="approved">Approved</option>
                  <option value="waitlisted">Waitlisted</option>
                  <option value="rejected">Rejected</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="filter-year">Registration Type</label>
                <select id="filter-year" multiple>
                  <option value="Employer">Employer</option>
                  <option value="Staff">Staff</option>
                  <option value="PhD">PhD</option>
                  <option value="Master's">Master's</option>
                  <option value="Senior">Senior</option>
                  <option value="Junior">Junior</option>
                  <option value="Sophomore">Sophomore</option>
                  <option value="Freshman">Freshman</option>
                </select>
              </div>

              <div class="filter-group">
                <label for="sort-by">Sort By</label>
                <div class="sort-controls">
                  <select id="sort-by">
                    <option value="">Default</option>
                    <option value="status">Status</option>
                    <option value="first_name">First Name</option>
                    <option value="last_name">Last Name</option>
                    <option value="middle_name">Middle Name</option>
                    <option value="academic_year">Academic Year</option>
                  </select>
                  <button id="sort-order-btn" class="sort-order-btn" title="Toggle sort order">
                    <span class="sort-arrow">&#8593;</span>
                  </button>
                </div>
              </div>

              <button id="clear-filters-btn" class="btn btn-secondary btn-small-clear">Clear</button>
            </div>
          </div>

          <div id="registrations-list" style="margin-top: 20px;">
            <div class="loading"><div class="spinner"></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Registration Details Modal -->
  <div id="registration-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-name">Registration Details</h2>
        <button class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="modal-grid">
          <div class="modal-info">
            <div class="info-group">
              <label>Email</label>
              <p id="modal-email"></p>
            </div>
            <div class="info-group">
              <label>Academic Year</label>
              <p id="modal-year"></p>
            </div>
            <div class="info-group" id="modal-major-group">
              <label>Major</label>
              <p id="modal-major"></p>
            </div>
            <div class="info-group" id="modal-field-group" style="display: none;">
              <label>Field of Study</label>
              <p id="modal-field"></p>
            </div>
            <div class="info-group" id="modal-company-group" style="display: none;">
              <label>Company</label>
              <p id="modal-company"></p>
            </div>
            <div class="info-group" id="modal-job-title-group" style="display: none;">
              <label>Job Title</label>
              <p id="modal-job-title"></p>
            </div>
            <div class="info-group" id="modal-company-website-group" style="display: none;">
              <label>Company Website</label>
              <p id="modal-company-website"></p>
            </div>
            <div class="info-group" id="modal-why-group">
              <label>Why do they want to attend?</label>
              <p id="modal-why" class="text-block"></p>
            </div>
            <div class="info-group" id="modal-courses-group">
              <label>Relevant Courses</label>
              <div id="modal-courses" class="pills-container"></div>
            </div>
            <div class="info-group" id="modal-work-group">
              <label>Prior Work Experience</label>
              <p id="modal-work" class="text-block"></p>
            </div>
            <div class="info-group">
              <label>Current Status</label>
              <p id="modal-status"></p>
            </div>
          </div>
          <div class="modal-resume" id="modal-resume-container">
            <label>Resume</label>
            <div class="pdf-viewer-container">
              <iframe id="modal-resume-viewer" class="pdf-viewer"></iframe>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="modal-approve-btn" class="btn btn-approve" onclick="modalUpdateStatus('approve')">Approve</button>
        <button id="modal-waitlist-btn" class="btn btn-waitlist" onclick="modalUpdateStatus('waitlist')">Waitlist</button>
        <button id="modal-reject-btn" class="btn btn-reject" onclick="modalUpdateStatus('reject')">Reject</button>
      </div>
    </div>
  </div>

  <script>
    // HTML escape function to prevent XSS attacks
    function escapeHtml(text) {
      if (text == null) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Verify session is valid via httpOnly cookie on page load
    fetch('/api/auth/session', { credentials: 'same-origin' })
      .then(res => {
        if (!res.ok) {
          window.location.href = '/login.html';
        }
      })
      .catch(() => {
        window.location.href = '/login.html';
      });

    // Store registrations data globally for modal access
    let registrationsData = [];
    let currentRegistrationId = null;
    let currentSortOrder = 'asc';
    let searchDebounceTimer = null;

    // Debounce function for search
    function debounce(func, delay) {
      return function(...args) {
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => func.apply(this, args), delay);
      };
    }

    // Get selected values from multi-select
    function getSelectedValues(selectId) {
      const select = document.getElementById(selectId);
      return Array.from(select.selectedOptions).map(opt => opt.value);
    }

    // Build query string for registrations API
    function buildRegistrationsQuery() {
      const params = new URLSearchParams();

      const search = document.getElementById('reg-search').value.trim();
      if (search) params.set('search', search);

      const statuses = getSelectedValues('filter-status');
      if (statuses.length > 0) params.set('status', statuses.join(','));

      const years = getSelectedValues('filter-year');
      if (years.length > 0) params.set('academicYear', years.join(','));

      const sortBy = document.getElementById('sort-by').value;
      if (sortBy) {
        params.set('sortBy', sortBy);
        params.set('sortOrder', currentSortOrder);
      }

      return params.toString();
    }

    // Toggle sort order
    function toggleSortOrder() {
      currentSortOrder = currentSortOrder === 'asc' ? 'desc' : 'asc';
      const arrow = document.querySelector('#sort-order-btn .sort-arrow');
      arrow.innerHTML = currentSortOrder === 'asc' ? '&#8593;' : '&#8595;';
      loadRegistrations();
    }

    // Clear all filters
    function clearFilters() {
      document.getElementById('reg-search').value = '';
      document.getElementById('filter-status').selectedIndex = -1;
      document.getElementById('filter-year').selectedIndex = -1;
      document.getElementById('sort-by').value = '';
      currentSortOrder = 'asc';
      document.querySelector('#sort-order-btn .sort-arrow').innerHTML = '&#8593;';
      loadRegistrations();
    }

    // Initialize filter controls event listeners
    function initFilterControls() {
      // Search with debounce
      document.getElementById('reg-search').addEventListener('input', debounce(() => {
        loadRegistrations();
      }, 300));

      // Status filter
      document.getElementById('filter-status').addEventListener('change', () => {
        loadRegistrations();
      });

      // Academic year filter
      document.getElementById('filter-year').addEventListener('change', () => {
        loadRegistrations();
      });

      // Sort by
      document.getElementById('sort-by').addEventListener('change', () => {
        loadRegistrations();
      });

      // Sort order toggle
      document.getElementById('sort-order-btn').addEventListener('click', toggleSortOrder);

      // Clear filters
      document.getElementById('clear-filters-btn').addEventListener('click', clearFilters);
    }

    // Navigation
    document.querySelectorAll('.nav-link').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const section = e.target.dataset.section;

        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
        e.target.classList.add('active');

        document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
        document.getElementById(section).classList.add('active');

        // Load data for the section
        if (section === 'speakers') loadSpeakers();
        if (section === 'events') loadEvents();
        if (section === 'sponsors') loadSponsors();
        if (section === 'registrations') loadRegistrations();
      });
    });

    // Logout
    document.getElementById('logout-link').addEventListener('click', async (e) => {
      e.preventDefault();
      try {
        await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'same-origin'
        });
      } catch {}
      window.location.href = '/login.html';
    });

    // Banner Form
    document.getElementById('banner-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageDiv = document.getElementById('banner-message');
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/admin/banner', {
          method: 'POST',
          credentials: 'same-origin',
          body: formData
        });
        const data = await res.json();

        if (res.ok) {
          messageDiv.innerHTML = `<div class="message success">Banner saved successfully!</div>`;
          e.target.reset();
        } else {
          messageDiv.innerHTML = `<div class="message error">${escapeHtml(data.error) || 'Failed to save banner'}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="message error">Network error</div>`;
      }
    });

    // Speakers Form
    document.getElementById('speakers-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageDiv = document.getElementById('speakers-message');
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/admin/speakers', {
          method: 'POST',
          credentials: 'same-origin',
          body: formData
        });
        const data = await res.json();

        if (res.ok) {
          messageDiv.innerHTML = `<div class="message success">Speaker added successfully!</div>`;
          e.target.reset();
          loadSpeakers();
        } else {
          messageDiv.innerHTML = `<div class="message error">${escapeHtml(data.error) || 'Failed to add speaker'}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="message error">Network error</div>`;
      }
    });

    // Events Form
    document.getElementById('events-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageDiv = document.getElementById('events-message');
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/admin/events', {
          method: 'POST',
          credentials: 'same-origin',
          body: formData
        });
        const data = await res.json();

        if (res.ok) {
          messageDiv.innerHTML = `<div class="message success">Event added successfully!</div>`;
          e.target.reset();
          loadEvents();
        } else {
          messageDiv.innerHTML = `<div class="message error">${escapeHtml(data.error) || 'Failed to add event'}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="message error">Network error</div>`;
      }
    });

    // Sponsors Form
    document.getElementById('sponsors-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const messageDiv = document.getElementById('sponsors-message');
      const formData = new FormData(e.target);

      try {
        const res = await fetch('/api/admin/sponsors', {
          method: 'POST',
          credentials: 'same-origin',
          body: formData
        });
        const data = await res.json();

        if (res.ok) {
          messageDiv.innerHTML = `<div class="message success">Sponsor added successfully!</div>`;
          e.target.reset();
          loadSponsors();
        } else {
          messageDiv.innerHTML = `<div class="message error">${escapeHtml(data.error) || 'Failed to add sponsor'}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="message error">Network error</div>`;
      }
    });

    // Load Speakers
    async function loadSpeakers() {
      try {
        const res = await fetch('/api/speakers');
        const data = await res.json();
        const container = document.getElementById('speakers-list');

        if (data.speakers && data.speakers.length > 0) {
          container.innerHTML = data.speakers.map(s => `
            <div class="card speaker-card">
              <img src="${escapeHtml(s.headshot_img_url)}" alt="${escapeHtml(s.first_name)}">
              <h3>${escapeHtml(s.first_name)}${s.middle_name ? ' ' + escapeHtml(s.middle_name) : ''}${s.last_name ? ' ' + escapeHtml(s.last_name) : ''}</h3>
              <p>${escapeHtml(s.bio.substring(0, 100))}...</p>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color: #888;">No speakers yet</p>';
        }
      } catch (err) {
        document.getElementById('speakers-list').innerHTML = '<p style="color: #ef4444;">Failed to load</p>';
      }
    }

    // Load Events
    async function loadEvents() {
      try {
        const res = await fetch('/api/events');
        const data = await res.json();
        const container = document.getElementById('events-list');

        if (data.events && data.events.length > 0) {
          container.innerHTML = data.events.map(e => `
            <div class="card">
              <img src="${escapeHtml(e.thumbnail_url)}" alt="${escapeHtml(e.event_title)}">
              <h3>${escapeHtml(e.event_title)}</h3>
              <p>${escapeHtml(e.event_description.substring(0, 100))}...</p>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color: #888;">No events yet</p>';
        }
      } catch (err) {
        document.getElementById('events-list').innerHTML = '<p style="color: #ef4444;">Failed to load</p>';
      }
    }

    // Load Sponsors
    async function loadSponsors() {
      try {
        const res = await fetch('/api/sponsors');
        const data = await res.json();
        const container = document.getElementById('sponsors-list');

        if (data.sponsors && data.sponsors.length > 0) {
          container.innerHTML = data.sponsors.map(s => `
            <div class="card">
              <img src="${escapeHtml(s.sponsor_logo)}" alt="${escapeHtml(s.sponsor_name)}" style="background: white; padding: 10px;">
              <h3>${escapeHtml(s.sponsor_name)}</h3>
              <p><span class="tag">${escapeHtml(s.sponsor_tier)}</span></p>
            </div>
          `).join('');
        } else {
          container.innerHTML = '<p style="color: #888;">No sponsors yet</p>';
        }
      } catch (err) {
        document.getElementById('sponsors-list').innerHTML = '<p style="color: #ef4444;">Failed to load</p>';
      }
    }

    // Load Registrations
    async function loadRegistrations() {
      try {
        const queryString = buildRegistrationsQuery();
        const url = '/api/admin/registrations' + (queryString ? '?' + queryString : '');
        const res = await fetch(url, { credentials: 'same-origin' });
        const data = await res.json();
        const container = document.getElementById('registrations-list');
        registrationsData = data.registrations || [];

        if (registrationsData.length > 0) {
          container.innerHTML = `
            <table class="registrations-table">
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Email</th>
                  <th>Year</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                ${registrationsData.map(r => `
                  <tr class="registration-row" onclick="openModal('${escapeHtml(r._id)}')">
                    <td>${escapeHtml(r.first_name)}${r.middle_name ? ' ' + escapeHtml(r.middle_name) : ''} ${escapeHtml(r.last_name)}</td>
                    <td>${escapeHtml(r.email)}</td>
                    <td>${escapeHtml(r.academic_year)}</td>
                    <td>${getStatusBadge(r)}</td>
                    <td class="actions-cell" onclick="event.stopPropagation()">
                      <button onclick="updateStatus('${escapeHtml(r._id)}', 'approve')" class="btn btn-small btn-approve-small" title="Approve">Approve</button>
                      <button onclick="updateStatus('${escapeHtml(r._id)}', 'waitlist')" class="btn btn-small btn-waitlist-small" title="Waitlist">Waitlist</button>
                      <button onclick="updateStatus('${escapeHtml(r._id)}', 'reject')" class="btn btn-small btn-reject-small" title="Reject">Reject</button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
        } else {
          container.innerHTML = '<p style="color: #888;">No registrations yet</p>';
        }
      } catch (err) {
        document.getElementById('registrations-list').innerHTML = '<p style="color: #ef4444;">Failed to load registrations</p>';
      }
    }

    // Get status badge HTML
    function getStatusBadge(r) {
      if (r.is_approved) {
        return '<span class="status-badge status-approved">Approved</span>';
      } else if (r.is_rejected) {
        return '<span class="status-badge status-rejected">Rejected</span>';
      } else if (r.is_waitlisted) {
        return '<span class="status-badge status-waitlisted">Waitlisted</span>';
      }
      return '<span class="status-badge status-pending">Pending</span>';
    }

    // Open modal with registration details
    function openModal(id) {
      const r = registrationsData.find(reg => reg._id === id);
      if (!r) return;

      currentRegistrationId = id;
      const isStaff = r.academic_year === 'Staff';
      const isEmployer = r.academic_year === 'Employer';
      const isStudent = !isStaff && !isEmployer;

      // Set name
      const fullName = `${r.first_name}${r.middle_name ? ' ' + r.middle_name : ''} ${r.last_name}`;
      document.getElementById('modal-name').textContent = fullName;

      // Set basic info
      document.getElementById('modal-email').textContent = r.email;
      document.getElementById('modal-year').textContent = r.academic_year;

      // Handle major/field of study based on registration type
      const majorGroup = document.getElementById('modal-major-group');
      const fieldGroup = document.getElementById('modal-field-group');

      if (isStaff) {
        majorGroup.style.display = 'none';
        if (r.field_of_study) {
          fieldGroup.style.display = 'block';
          document.getElementById('modal-field').textContent = r.field_of_study;
        } else {
          fieldGroup.style.display = 'none';
        }
      } else if (isEmployer) {
        majorGroup.style.display = 'none';
        fieldGroup.style.display = 'none';
      } else {
        majorGroup.style.display = 'block';
        fieldGroup.style.display = 'none';
        document.getElementById('modal-major').textContent = r.major || 'N/A';
      }

      // Handle employer-specific fields
      const companyGroup = document.getElementById('modal-company-group');
      const jobTitleGroup = document.getElementById('modal-job-title-group');
      const companyWebsiteGroup = document.getElementById('modal-company-website-group');

      if (isEmployer) {
        companyGroup.style.display = 'block';
        document.getElementById('modal-company').textContent = r.company_name || 'N/A';

        jobTitleGroup.style.display = 'block';
        document.getElementById('modal-job-title').textContent = r.job_title || 'N/A';

        if (r.company_website) {
          companyWebsiteGroup.style.display = 'block';
          document.getElementById('modal-company-website').innerHTML =
            `<a href="${escapeHtml(r.company_website)}" target="_blank" rel="noopener">${escapeHtml(r.company_website)}</a>`;
        } else {
          companyWebsiteGroup.style.display = 'none';
        }
      } else {
        companyGroup.style.display = 'none';
        jobTitleGroup.style.display = 'none';
        companyWebsiteGroup.style.display = 'none';
      }

      // Handle why_attend (students only)
      const whyGroup = document.getElementById('modal-why-group');
      if (!isStudent || !r.why_attend) {
        whyGroup.style.display = 'none';
      } else {
        whyGroup.style.display = 'block';
        document.getElementById('modal-why').textContent = r.why_attend;
      }

      // Handle relevant courses as pills (students only)
      const coursesGroup = document.getElementById('modal-courses-group');
      const coursesContainer = document.getElementById('modal-courses');
      if (!isStudent || !r.relevant_courses || r.relevant_courses.length === 0) {
        coursesGroup.style.display = 'none';
      } else {
        coursesGroup.style.display = 'block';
        coursesContainer.innerHTML = r.relevant_courses.map(course =>
          `<span class="pill">${escapeHtml(course)}</span>`
        ).join('');
      }

      // Handle prior work experience (students only)
      const workGroup = document.getElementById('modal-work-group');
      if (!isStudent || !r.prior_work_exp) {
        workGroup.style.display = 'none';
      } else {
        workGroup.style.display = 'block';
        document.getElementById('modal-work').textContent = r.prior_work_exp;
      }

      // Set status
      document.getElementById('modal-status').innerHTML = getStatusBadge(r);

      // Handle resume PDF viewer (students only)
      const resumeContainer = document.getElementById('modal-resume-container');
      const resumeViewer = document.getElementById('modal-resume-viewer');
      if (!isStudent || !r.resume) {
        resumeContainer.style.display = 'none';
        resumeViewer.src = '';
      } else {
        resumeContainer.style.display = 'block';
        resumeViewer.src = `/api/files/${r.resume}`;
      }

      // Show modal
      document.getElementById('registration-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    // Close modal
    function closeModal() {
      document.getElementById('registration-modal').classList.remove('active');
      document.body.style.overflow = '';
      document.getElementById('modal-resume-viewer').src = '';
      currentRegistrationId = null;
    }

    // Close modal on escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // Close modal on backdrop click
    document.getElementById('registration-modal').addEventListener('click', (e) => {
      if (e.target.id === 'registration-modal') closeModal();
    });

    // Update registration status from modal
    function modalUpdateStatus(action) {
      if (currentRegistrationId) {
        updateStatus(currentRegistrationId, action);
      }
    }

    // Update registration status
    async function updateStatus(id, action) {
      let updateData = {};

      switch (action) {
        case 'approve':
          updateData = { is_approved: true, is_waitlisted: false, is_rejected: false };
          break;
        case 'waitlist':
          updateData = { is_approved: false, is_waitlisted: true, is_rejected: false };
          break;
        case 'reject':
          updateData = { is_approved: false, is_waitlisted: false, is_rejected: true };
          break;
      }

      try {
        const res = await fetch(`/api/admin/registrations/${id}`, {
          method: 'PATCH',
          credentials: 'same-origin',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(updateData)
        });

        if (res.ok) {
          await loadRegistrations();
          // Update modal status if open
          if (currentRegistrationId === id) {
            const r = registrationsData.find(reg => reg._id === id);
            if (r) {
              document.getElementById('modal-status').innerHTML = getStatusBadge(r);
            }
          }
        } else {
          alert('Failed to update status');
        }
      } catch (err) {
        alert('Network error');
      }
    }

    // Initialize filter controls when page loads
    initFilterControls();
  </script>
</body>
</html>

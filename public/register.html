<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Summit - Register</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">AI Summit</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="/login.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container">
    <section style="padding-top: 40px;">
      <div class="form-container">
        <h1>Register for AI Summit</h1>

        <div id="message"></div>

        <form id="registration-form">
          <div class="form-group">
            <label for="first_name">First Name *</label>
            <input type="text" id="first_name" name="first_name" required maxlength="1000">
          </div>

          <div class="form-group">
            <label for="middle_name">Middle Name</label>
            <input type="text" id="middle_name" name="middle_name" maxlength="1000">
          </div>

          <div class="form-group">
            <label for="last_name">Last Name *</label>
            <input type="text" id="last_name" name="last_name" required maxlength="1000">
          </div>

          <div class="form-group">
            <label for="email">Email *</label>
            <input type="email" id="email" name="email" required maxlength="1000">
            <p class="form-hint" id="email-hint">Must be @asu.edu or @gmail.com</p>
          </div>

          <div class="form-group">
            <label for="academic_year">Registration Type *</label>
            <select id="academic_year" name="academic_year" required>
              <option value="">Select your registration type...</option>
              <option value="Freshman">Freshman</option>
              <option value="Sophomore">Sophomore</option>
              <option value="Junior">Junior</option>
              <option value="Senior">Senior</option>
              <option value="Master's">Master's</option>
              <option value="PhD">PhD</option>
              <option value="Staff">Staff</option>
              <option value="Employer">Employer</option>
            </select>
          </div>

          <div class="form-group" id="field-of-study-group" style="display: none;">
            <label for="field_of_study">Field of Study *</label>
            <input type="text" id="field_of_study" name="field_of_study" maxlength="1000">
          </div>

          <div class="form-group" id="company-name-group" style="display: none;">
            <label for="company_name">Company Name *</label>
            <input type="text" id="company_name" name="company_name" maxlength="1000">
          </div>

          <div class="form-group" id="job-title-group" style="display: none;">
            <label for="job_title">Job Title *</label>
            <input type="text" id="job_title" name="job_title" maxlength="1000">
          </div>

          <div class="form-group" id="company-website-group" style="display: none;">
            <label for="company_website">Company Website</label>
            <input type="url" id="company_website" name="company_website" maxlength="1000" placeholder="https://...">
            <p class="form-hint">Optional</p>
          </div>

          <div class="form-group" id="major-group">
            <label for="major">Major *</label>
            <input type="text" id="major" name="major" required maxlength="1000">
          </div>

          <div class="form-group" id="why-attend-group">
            <label for="why_attend">Why do you want to attend? *</label>
            <textarea id="why_attend" name="why_attend" maxlength="10000"></textarea>
            <p class="form-hint">Minimum 500 characters</p>
            <p class="form-hint" id="char-count">0 / 500 characters</p>
          </div>

          <div class="form-group" id="resume-group">
            <label for="resume">Resume (PDF) *</label>
            <input type="file" id="resume" name="resume" accept="application/pdf">
            <p class="form-hint">Max 5MB, PDF only</p>
          </div>

          <div class="form-group" id="relevant-courses-group">
            <label for="relevant_courses">Relevant Courses</label>
            <input type="text" id="relevant_courses" name="relevant_courses" maxlength="1000">
            <p class="form-hint">Comma-separated list (optional)</p>
          </div>

          <div class="form-group" id="prior-work-group">
            <label for="prior_work_exp">Prior Work Experience</label>
            <textarea id="prior_work_exp" name="prior_work_exp" maxlength="10000"></textarea>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="photo_release" name="photo_release" required>
              <span>I acknowledge and agree to the photo release policy *</span>
            </label>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="submit-btn">Submit Registration</button>
          </div>
        </form>
      </div>
    </section>
  </div>

  <script>
    // HTML escape function to prevent XSS attacks
    function escapeHtml(text) {
      if (text == null) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    const form = document.getElementById('registration-form');
    const whyAttend = document.getElementById('why_attend');
    const charCount = document.getElementById('char-count');
    const academicYear = document.getElementById('academic_year');
    const messageDiv = document.getElementById('message');
    const submitBtn = document.getElementById('submit-btn');

    // Student-only fields (hidden for Staff and Employer)
    const studentOnlyFields = [
      'major-group',
      'why-attend-group',
      'resume-group',
      'relevant-courses-group',
      'prior-work-group'
    ];

    // Employer-only fields
    const employerOnlyFields = [
      'company-name-group',
      'job-title-group',
      'company-website-group'
    ];

    function toggleRegistrationTypeFields() {
      const regType = academicYear.value;
      const isStaff = regType === 'Staff';
      const isEmployer = regType === 'Employer';
      const isStudent = !isStaff && !isEmployer && regType !== '';

      // Hide student fields for Staff and Employer
      studentOnlyFields.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.style.display = isStudent ? 'block' : 'none';
        }
      });

      // Toggle required for student fields
      document.getElementById('major').required = isStudent;

      // Show/hide Staff field (field of study)
      const fieldOfStudyGroup = document.getElementById('field-of-study-group');
      const fieldOfStudy = document.getElementById('field_of_study');
      fieldOfStudyGroup.style.display = isStaff ? 'block' : 'none';
      fieldOfStudy.required = isStaff;

      // Show/hide Employer fields
      employerOnlyFields.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.style.display = isEmployer ? 'block' : 'none';
        }
      });

      // Toggle required for employer fields
      document.getElementById('company_name').required = isEmployer;
      document.getElementById('job_title').required = isEmployer;

      // Update email hint for employers
      const emailHint = document.getElementById('email-hint');
      if (isEmployer) {
        emailHint.textContent = 'Any valid email address';
      } else {
        emailHint.textContent = 'Must be @asu.edu or @gmail.com';
      }
    }

    academicYear.addEventListener('change', toggleRegistrationTypeFields);

    // Resume file validation constants
    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB
    const resumeInput = document.getElementById('resume');

    // Validate resume file on selection
    resumeInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        if (file.size > MAX_FILE_SIZE) {
          messageDiv.innerHTML = `<div class="message error">Resume file is too large. Maximum size is 5MB. Your file is ${(file.size / (1024 * 1024)).toFixed(2)}MB.</div>`;
          this.value = ''; // Clear the file input
          return;
        }
        if (file.type !== 'application/pdf') {
          messageDiv.innerHTML = `<div class="message error">Resume must be a PDF file. You selected: ${escapeHtml(file.type || 'unknown type')}</div>`;
          this.value = ''; // Clear the file input
          return;
        }
        // Valid file - clear any previous error
        messageDiv.innerHTML = '';
      }
    });

    whyAttend.addEventListener('input', () => {
      const count = whyAttend.value.length;
      charCount.textContent = `${count} / 500 characters`;
      charCount.style.color = count >= 500 ? '#22c55e' : '#888';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.innerHTML = '';

      // Validate resume file before submission (for students only - not Staff or Employer)
      const isStaff = academicYear.value === 'Staff';
      const isEmployer = academicYear.value === 'Employer';
      if (!isStaff && !isEmployer && resumeInput.files.length > 0) {
        const file = resumeInput.files[0];
        if (file.size > MAX_FILE_SIZE) {
          messageDiv.innerHTML = `<div class="message error">Resume file is too large. Maximum size is 5MB. Your file is ${(file.size / (1024 * 1024)).toFixed(2)}MB.</div>`;
          return;
        }
        if (file.type !== 'application/pdf') {
          messageDiv.innerHTML = `<div class="message error">Resume must be a PDF file.</div>`;
          return;
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';

      const formData = new FormData(form);
      formData.set('photo_release', document.getElementById('photo_release').checked ? 'true' : 'false');

      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          body: formData
        });

        const data = await res.json();

        if (res.ok) {
          messageDiv.innerHTML = `<div class="message success">${escapeHtml(data.message) || 'Registration submitted successfully!'}</div>`;
          form.reset();
          charCount.textContent = '0 / 500 characters';
        } else {
          let errorMsg = escapeHtml(data.error) || 'Registration failed';
          if (data.errors) {
            errorMsg += '<ul style="margin-top: 10px; margin-left: 20px;">';
            for (const [field, msg] of Object.entries(data.errors)) {
              errorMsg += `<li>${escapeHtml(field)}: ${escapeHtml(msg)}</li>`;
            }
            errorMsg += '</ul>';
          }
          messageDiv.innerHTML = `<div class="message error">${errorMsg}</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="message error">Network error. Please try again.</div>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Registration';
      }
    });
  </script>
</body>
</html>

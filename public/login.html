<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Summit - Admin Login</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .discord-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background-color: #5865F2;
      color: white;
      padding: 14px 28px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      width: 100%;
      text-decoration: none;
    }
    .discord-btn:hover {
      background-color: #4752C4;
    }
    .discord-btn svg {
      width: 24px;
      height: 24px;
    }
    .login-info {
      text-align: center;
      color: #888;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">AI Summit</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="/login.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container login-container">
    <div class="form-container login-box">
      <h1>Admin Login</h1>

      <div id="message"></div>

      <a href="/api/auth/discord" class="discord-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Sign in with Discord
      </a>

      <p class="login-info">
        You must be an admin in the AI Summit Discord server to access the admin panel.
      </p>
    </div>
  </div>

  <script>
    // Check if already logged in
    const token = localStorage.getItem('authToken');
    if (token) {
      // Verify token is still valid
      fetch('/api/auth/session', {
        headers: { 'Authorization': `Bearer ${token}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data.authenticated) {
          window.location.href = '/admin.html';
        } else {
          localStorage.removeItem('authToken');
        }
      })
      .catch(() => {
        localStorage.removeItem('authToken');
      });
    }

    // Check for error in URL
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error');
    if (error) {
      const messageDiv = document.getElementById('message');
      let errorMessage = 'An error occurred. Please try again.';

      switch (error) {
        case 'unauthorized':
          errorMessage = 'Access denied. You must have the admin role in Discord.';
          break;
        case 'oauth_failed':
          errorMessage = 'Discord authorization failed. Please try again.';
          break;
        case 'token_exchange_failed':
          errorMessage = 'Failed to authenticate with Discord. Please try again.';
          break;
        case 'user_fetch_failed':
          errorMessage = 'Failed to fetch Discord user info. Please try again.';
          break;
        case 'server_error':
          errorMessage = 'Server error occurred. Please try again later.';
          break;
      }

      messageDiv.innerHTML = `<div class="message error">${errorMessage}</div>`;
    }
  </script>
</body>
</html>

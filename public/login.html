<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Summit - Admin Login</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">AI Summit</a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/register.html">Register</a></li>
        <li><a href="/login.html">Admin</a></li>
      </ul>
    </div>
  </nav>

  <div class="container login-container">
    <div class="form-container login-box">
      <h1>Admin Login</h1>

      <div id="message"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="login-btn">Login</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const messageDiv = document.getElementById('message');
    const loginBtn = document.getElementById('login-btn');

    // Check if already logged in
    if (localStorage.getItem('adminAuth')) {
      window.location.href = '/admin.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.innerHTML = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Logging in...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      // Create Basic Auth header
      const authString = btoa(`${username}:${password}`);

      try {
        // Test credentials by calling a protected endpoint
        const res = await fetch('/api/admin/registrations', {
          headers: {
            'Authorization': `Basic ${authString}`
          }
        });

        if (res.ok) {
          // Store credentials in localStorage
          localStorage.setItem('adminAuth', authString);
          window.location.href = '/admin.html';
        } else {
          messageDiv.innerHTML = `<div class="message error">Invalid username or password</div>`;
        }
      } catch (err) {
        messageDiv.innerHTML = `<div class="message error">Network error. Please try again.</div>`;
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
